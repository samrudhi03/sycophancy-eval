[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sycophancy-eval"
version = "0.1.0"
description = "Evaluating sycophancy in large language models with Inspect"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.200",
    "pandas>=2.0",
    "datasets>=2.18",
    "matplotlib>=3.8",
    "groq>=0.20",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["sycophancy_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
